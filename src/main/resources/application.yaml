server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stcp-uploader
  profiles:
    active: ${PROFILE:local}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Gradiente de externalización: application.yaml exige variables de entorno sin
# default (salvo el puerto), application-local.yaml las fija en literales para
# desarrollo contra infra/docker-compose.yaml.
stcp:
  sftp:
    host: ${STCP_SFTP_HOST}
    port: ${STCP_SFTP_PORT:22}
    user: ${STCP_SFTP_USER}
    password: ${STCP_SFTP_PASSWORD}
    remote-directory: ${STCP_SFTP_REMOTE_DIR:/ENTRADA}
    allow-unknown-keys: ${STCP_SFTP_ALLOW_UNKNOWN_KEYS:false}
