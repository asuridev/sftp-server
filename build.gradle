plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.asuridev'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Integration 6.5 (el que trae Boot 3.5.x) migró el módulo SFTP de JSch a
    // Apache MINA SSHD (org.apache.sshd.sftp.client.SftpClient), que sí soporta los
    // algoritmos modernos de intercambio de llaves (curve25519, etc.) que rompían el
    // handshake con JSch clásico contra el atmoz/sftp emulado en Fase 1. No hace falta
    // ninguna dependencia extra: sshd-core/sshd-sftp llegan transitivamente.
    implementation 'org.springframework.integration:spring-integration-sftp'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Source set separado para pruebas de integracion "caja negra": hablan solo HTTP
// contra el servicio ya arrancado, sin importar clases de src/main en compilacion
// (mismo patron que asset-vault-spring/build.gradle).
sourceSets {
    integrationTest {
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.named('test') {
    useJUnitPlatform()
}

// Requiere infra/docker-compose.yaml levantado (Fase 1). Fuera de `check` a proposito:
// `./gradlew build -x test -x integrationTest` debe seguir siendo el gate de compilacion
// sin depender de infraestructura externa.
tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}
